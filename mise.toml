min_version = "2026.10.17"

[settings]
lockfile = true
pin = true

[tools]
node = "26.12.1"
terraform = "1.17.0"
awscli = { version = "2.38.5", symlink_bins = "true" }
direnv = "2.38.2"
uv = "0.13.5"
kubectl = "1.37.1"
go = "1.27.3"
pnpm = "12.15.0"
eza = "0.23.5"
bat = "0.26.1"
fd = "10.5.0"
starship = "1.27.0"
atuin = "18.24.1"
gh = "2.103.0"
ghq = "1.11.2"
fzf = "0.74.5"
ripgrep = "15.2.0"
jq = "1.8.2"
git-lfs = "3.8.0"
herdr = "0.9.5"
ghtkn = "0.4.2"

[env]
# eMudhra 中間証明書の脆弱性対応。AWS CLI 同梱の CA バンドルが更新されるまで、brew の ca-certificates を使う
AWS_CA_BUNDLE = "/opt/homebrew/etc/ca-certificates/cert.pem"

[dotfiles]
"~/.zshrc" = "mac/zsh/.zshrc"
"~/.vimrc" = "mac/vim/.vimrc"
"~/.gitconfig" = "mac/git/.gitconfig"
"~/.config/git/ignore" = "mac/git/ignore"
"~/.config/starship.toml" = "mac/starship/starship.toml"
"~/.config/herdr/config.toml" = "mac/herdr/config.toml"
"~/.hammerspoon/init.lua" = "mac/hammerspoon/init.lua"
"~/Library/Application Support/com.mitchellh.ghostty/config" = "mac/ghostty/config"
"~/.local/bin/dot" = "mac/scripts/dot"
"~/.local/bin/ssh-sign" = "mac/scripts/ssh-sign"
"~/.claude/CLAUDE.md" = "mac/claude/CLAUDE.md"
"~/.claude/statusline.sh" = "mac/claude/statusline.sh"
"~/.claude/skills" = "mac/claude/skills"
"~/ghq/dotfiles" = "."

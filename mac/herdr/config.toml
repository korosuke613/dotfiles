onboarding = false

[ui]
status_indicators = "symbols"
sidebar_width = 42
sidebar_min_width = 36
sidebar_max_width = 52

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
rows = [
  ["state_icon", "state_text"],
  [{ token = "agent", fg = "#cdd6f4", bold = true, dim = false }],
  ["$repo"],
  [{ token = "terminal_title_stripped", fg = "#cdd6f4", bold = true, dim = false }],
]

[ui.toast]
delivery = "system"
